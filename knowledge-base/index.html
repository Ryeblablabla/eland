/** 材料链样品：矿石、黏土与木/石/青铜/铁工具。 */
function genEraMaterial(B, kind){
  const colors={clay:0xa9664e,copper:0x9b6546,tin:0x8b9298,ironore:0x665c55,woodtool:0x8a613d,stonehoe:0x77746e,bronzetool:0xaa713c,irontool:0x4d5358};
  const tool=kind.endsWith('tool')||kind==='stonehoe';
  if(tool){
    box(B,'wood',0,1,0,0,7,0,()=>0x765038);
    box(B,kind==='woodtool'?'wood':kind==='stonehoe'?'stone':kind==='bronzetool'?'metal':'darkMetal',-2,7,0,2,8,0,()=>colors[kind]);
    return;
  }
  for(let i=0;i<18;i++){
    const x=Math.round((rand()-.5)*6),z=Math.round((rand()-.5)*6),y=1+Math.floor(rand()*2);
    B.vox(kind==='clay'?'brick':kind==='tin'?'metal':kind==='ironore'?'darkMetal':'stone',x,y,z,vary(colors[kind],0.02,0.10,0.08));
  }
}

/** 火焰：跳动的篝火（Fire 材质的具象化） */
function genFire(B){
  const p = fireAnimPhase;
  const swayA = Math.sin(p)*0.7;
  const swayB = Math.sin(p*1.63+1.2)*0.55;
  const stretch = 1 + Math.sin(p*2.1)*0.12 + Math.sin(p*3.7+0.8)*0.06;
  const stones = [[-3,0],[-2,-2],[0,-3],[2,-2],[3,0],[2,2],[0,3],[-2,2]];
  stones.forEach(([x,z],i)=>B.microCuboid('stone',x,0,z,1.6,1,1.6,
    vary(i%2?0x56504a:0x484541,0,0.04,0.05)));
  B.microCuboid('woodDark',0,0.7,0,6,1,1.2,0x3c2d22);
  B.microCuboid('woodDark',0,0.8,0,1.2,1,6,0x4a3424);
  for(const [x,z,c] of [[-1.5,-1,0xb83a24],[1.4,-0.8,0xe0522f],[-0.8,1.3,0xff6a3a],[1.2,1.2,0xc43d25]])
    B.microCuboid('glowRed',x,1.3,z,1.2,0.8,1.2,c);

  B.microCuboid('glowRed',swayB*0.18,1.4,0,3.8,2.4*stretch,3.6,0xff5b32);
  B.microCuboid('glowWarm',-0.7+swayA*0.35,2.8,0.4,2.1,3.2*stretch,2,0xffa33f);
  B.microCuboid('glowWarm',0.9-swayB*0.35,2.5,-0.5,1.8,2.7*(2-stretch),1.8,0xffb44f);
  B.microCuboid('glowWarm',swayA*0.15,3.1,0,1.5,2.5*stretch,1.5,0xffd875);
  B.microCuboid('glowRed',-1.2+swayA,4.5,-0.3,1.2,3.1*stretch,1.2,0xff6a34);
  B.microCuboid('glowWarm',0.8+swayB,4.8,0.5,1,3.5*(2-stretch),1,0xffbd55);
  B.microCuboid('glowWarm',swayA*0.75,5.1,-0.4,0.8,2.8*stretch,0.8,0xffe1a0);
  for(const [i,x,z,c] of [[0,-1.8,0.8,0xff7a3f],[1,1.7,-0.9,0xffcf68],[2,0.5,1,0xff6a3a]]){
    const rise = ((p*0.09+i*0.31)%1+1)%1;
    const s = 0.7-rise*0.42;
    B.microCuboid(i===1?'glowWarm':'glowRed',x+Math.sin(p*1.4+i)*0.35,6.3+rise*4,z,s,s,s,c);
  }
}

/** 焦土残骸：碳化木桩 + 灰烬堆 + 暗红余烬（Ash 地带） */
function genScorched(B){
  B.vox('woodDark', 0,1,0, 0x26221f); B.vox('woodDark', 0,2,0, 0x26221f); B.vox('woodDark', 1,3,0, 0x2a2725);
  B.vox('woodDark', -3,1,-2, 0x26221f); B.vox('woodDark', -3,2,-2, 0x2a2725);
  B.vox('woodDark', 2,1,2, 0x26221f);
  for(let i=0;i<10;i++){                                                 // 灰烬堆
    const x = Math.round((rand()-0.5)*8), z = Math.round((rand()-0.5)*8);
    B.vox('plaster', x,1,z, vary(0x5a5855,0,0.04,0.05));
  }
  for(let i=0;i<5;i++){                                                  // 暗红余烬
    const x = Math.round((rand()-0.5)*6), z = Math.round((rand()-0.5)*6);
    B.vox('glowRed', x,1,z, 0x8a2a20);
  }
}

/** 雪堆：雪丘 + 半埋岩石 */
function genSnowdrift(B){
  for (const [cx,cz,r] of [[-2,0,2.2],[2,1,1.6],[1,-2,1.2]]){
    for(let y=1;y<=3;y++) for(let x=-3;x<=3;x++) for(let z=-3;z<=3;z++){
      if (Math.sqrt(x*x+(y-0.8)*(y-0.8)*2+z*z) > r) continue;
      B.vox('plaster', cx+x,y,cz+z, vary(0xeef2f6,0,0.02,0.03));
    }
  }
  B.vox('stone', -4,1,2, vary(0x84888d,0,0.05,0.07));                    // 半埋岩石
  B.vox('plaster', -4,2,2, 0xeef2f6);
}

/** 冰锥：透射冰晶尖簇 */
function genIceSpikes(B){
  for (const [sx,sz,h] of [[0,0,5],[-2,1,3],[2,-1,4],[1,2,2],[-1,-2,3]]){
    for(let y=1;y<=h;y++){
      const w = y<=2 ? 1 : 0;
      for(let dx=0;dx<=w;dx++) for(let dz=0;dz<=w;dz++)
        B.vox('glass', sx+dx,y,sz+dz, vary(0xbfe8f4,0,0.06,0.06));
    }
  }
}

/** 雪松：云杉的积雪变体（叶缘挂雪） */
function genSnowSpruce(B){
  box(B,'wood', 0,1,0, 0,3,0, ()=>vary(0x5f422a,0,0.08,0.06));
  for(let y=3;y<=9;y++){
    const r = 3.2 - (y-3)*0.45;
    for(let x=-3;x<=3;x++) for(let z=-3;z<=3;z++){
      const d = Math.hypot(x,z);
      if (d > r+0.2) continue;
      if (rand()<0.1) continue;
      if (d > r-0.9) B.vox('plaster', x,y,z, vary(0xeef2f6,0,0.02,0.03)); // 叶缘积雪
      else B.vox('leaf', x,y,z, vary(0x2a4a34,0.02,0.1,0.07));
    }
  }
  B.vox('plaster', 0,10,0, 0xeef2f6);                                     // 顶雪
}

/** 环境动态展示：视觉层会动，但水体与天气事实仍由模拟状态决定。 */
function genRiverFlow(B){
  const p=weatherAnimPhase;
  // 两格宽的权威水体积；上方仅叠加低对比像素色阶，不放置漂浮的高亮实体块。
  B.microCuboid('water',0,2,0,16,2,34,0x286f91);
  B.microCuboid('stone',-9,0,0,2,2,34,0x786f60);
  B.microCuboid('stone',9,0,0,2,2,34,0x786f60);
  for(let x=-7;x<=7;x++) for(let z=-16;z<=16;z++){
    const main=0.5+0.5*Math.sin(z*0.53-p*1.45+Math.sin(x*0.6)*0.42);
    const cross=0.5+0.5*Math.sin(z*0.95-p*2.05+x*0.27);
    const flow=Math.max(0,Math.min(1,(main-0.38)/0.56))*(0.72+cross*0.28);
    const r=Math.round(26+(76-26)*flow), g=Math.round(96+(151-96)*flow), b=Math.round(114+(161-114)*flow);
    B.microCuboid('flowWater',x,4.03,z,1.02,0.12,1.02,(r<<16)|(g<<8)|b);
  }
}

function genWeather(B, kind){
  const p=weatherAnimPhase;
  if(kind==='rain'){
    for(let i=0;i<24;i++){
      const x=Math.round((rand()-0.5)*14), z=Math.round((rand()-0.5)*14);
      const fall=((p*1.4+i*0.37)%8+8)%8;
      B.microCuboid('water',x,3+fall,z,0.35,3.2,0.35,i%3?0x4f91b5:0x73b0ce);
    }
    for(const [x,z,r] of [[-3,-1,4],[3,2,3],[1,-4,2.5]]){
      B.microCuboid('water',x,2.05,z,r,0.18,r,0x477f9f);
      const pulse=1+((p*0.45+x)%1+1)%1*2;
      const arc=Math.max(0.4,r-pulse);
      B.microCuboid('glowCyan',x-r/2-pulse/2,2.22,z,arc,0.12,0.22,0x75b6d3);
      B.microCuboid('glowCyan',x+r/2+pulse/2,2.22,z,arc,0.12,0.22,0x75b6d3);
    }
    return;
  }
  if(kind==='snow'){
    for(let i=0;i<30;i++){
      const x=Math.round((rand()-0.5)*15), z=Math.round((rand()-0.5)*15);
      const fall=((p*0.55+i*0.47)%12+12)%12, drift=Math.sin(p+i)*0.8;
      B.microCuboid('plaster',x+drift,3+fall,z,0.7,0.7,0.7,i%3?0xeef2f6:0xdbe6ef);
    }
    return;
  }
  if(kind==='fog'){
    for(let i=0;i<7;i++){
      const x=-8+i*2.6+Math.sin(p*0.35+i)*0.8, z=-4+(i%3)*4;
      B.microCuboid('glass',x,2.3+(i%2)*0.6,z,7,0.8,2.2,i%2?0xc7d1d4:0xb8c4c8);
    }
    return;
  }
  if(kind==='storm'){
    const sway=Math.sin(p)*1.2;
    for(let y=1;y<=7;y++) B.vox('wood',Math.round(sway*y/14),y,0,vary(0x6e4f33,0,0.08,0.06));
    for(let x=-4;x<=4;x++) for(let z=-3;z<=3;z++) if(Math.hypot(x,z)<3.8&&rand()>0.18)
      B.vox('leaf',x+Math.round(sway),7+Math.round((3.8-Math.hypot(x,z))*0.45),z,vary(0x3f7f3a,0.03,0.14,0.10));
    for(let i=0;i<16;i++) B.microCuboid('glowCyan',-7+i,4+(i%5),-4+(i%4)*2,2.2,0.28,0.28,0x6d9db6);
    return;
  }
  if(kind==='drought'){
    genGroundDetail(B,'cracks');
    for(const [x,z,h] of [[-4,-2,3],[-1,3,4],[3,2,3],[4,-3,2]])
      B.microCuboid('thatch',x,2,z,1,h,1,vary(0x9b8547,0.02,0.10,0.08));
  }
}

/* ================= 人物 · 年龄 / 状态 / 动作 ================= */

// 人物沿用本页 micro-cuboid-v2 体素语汇。动作页以 10fps 更新这一相位，
// 所有颜色仍由 seed 决定，因此动画不会闪烁。
let humanAnimPhase = 0;
let animalAnimPhase = 0;
let fireAnimPhase = 0;
let weatherAnimPhase = 0;

function genHuman(B, options={}){
  const sex = options.sex || 'male';
  const age = options.age || 'adult';
  const action = options.action || 'idle';
  const state = options.state || 'active';
  const hairStyle = options.hairStyle || (sex==='female' ? 'long' : 'crop');
  const headShape = options.headShape || 'standard';
  const outfitCut = options.outfitCut || 'standard';
  const ox = options.x || 0, oz = options.z || 0;
  const ageScale = age==='child' ? 0.78 : age==='elder' ? 0.93 : 1;
  const s = ageScale * (options.scale || 1);
  const base = options.base ?? 2;
  const phase = humanAnimPhase + (options.phaseOffset || 0);
  const clothBase = options.cloth ?? (sex==='female' ? 0x925a67 : age==='child' ? 0xb9783f : age==='elder' ? 0x66717b : 0x3f6380);
  const cloth = vary(clothBase,0.02,0.08,0.07);
  const clothDark = vary(sex==='female' ? 0x5c3f51 : 0x303f50,0.01,0.06,0.05);
  const skin = vary(options.skin ?? 0xd9aa7a,0.015,0.08,0.06);
  const hair = age==='elder' ? vary(0xb9bec4,0,0.03,0.05) : vary(options.hair ?? 0x30261f,0.01,0.08,0.05);
  const put = (type,x,y,z,sx,sy,sz,color) => B.microCuboid(type,ox+x*s,base+y*s,oz+z*s,sx*s,sy*s,sz*s,color);

  if (state==='dehydrated'){
    // 三体式脱水不是换色：身体收束成可搬运的干燥卷，保留头发、面部与衣料识别点。
    put('woodDark',0,0.08,0,2.25,0.30,4.5,vary(0x59483a,0.01,0.05,0.05));
    put('thatch',0,0.35,0,2.05,0.75,4.2,vary(0x9b7657,0.01,0.08,0.07));
    for(const z of [-1.25,0,1.25]) put('clothBand',0,0.55,z,2.18,0.25,0.34,0x6f8fa8);
    put('skin',0,0.42,2.55,1.45,1.05,1.25,skin);
    put('woodDark',0,1.00,2.55,1.55,0.28,1.30,hair);
    put('woodDark',-0.34,0.74,3.18,0.18,0.18,0.12,0x241f1b);
    put('woodDark', 0.34,0.74,3.18,0.18,0.18,0.12,0x241f1b);
    // 蓝色状态签名，和主游戏脱水状态色保持一致。
    put('glowCyan',0,0.02,-2.40,2.8,0.12,0.20,0x60a5fa);
    return;
  }

  const child = age==='child', elder = age==='elder';
  let legH = child ? 1.45 : elder ? 1.62 : 1.9;
  const torsoH = child ? 1.72 : elder ? 2.02 : 2.18;
  const baseHeadH = child ? 1.72 : 1.54;
  const shoulder = child ? 1.72 : sex==='male' ? 2.30 : 2.02;
  const breath = Math.sin(phase*0.55)*0.035;
  const walk = action==='walk' ? Math.sin(phase)*0.48 : 0;
  const gather = action==='gather';
  const attack = action==='attack';
  const carry = action==='carry';
  const ingest = action==='ingest';
  const craft = action==='craft';
  const work = action==='work';
  const tendFire = action==='tend-fire';
  const attend = action==='attend';
  const communicate = action==='communicate';
  const care = action==='care';
  const lowered = gather || care || tendFire;
  if (lowered) legH *= care ? 0.58 : 0.68;
  const torsoBottom = legH - (lowered ? 0.08 : 0);
  const leanZ = elder ? 0.24 : lowered ? 0.48 : craft || work ? 0.28 : 0;
  const stance = attack ? 0.18 : 0;

  // 脚、腿：步行用前后相反的 z 偏移；攻击使用更宽的稳定站姿。
  const footSpread = attack ? 0.76 : child ? 0.44 : 0.56;
  put('woodDark',-footSpread,0,-0.18+walk,0.84,0.38,1.28,clothDark);
  put('woodDark', footSpread,0,-0.18-walk,0.84,0.38,1.28,clothDark);
  put('woodDark',-footSpread,0.28,walk,0.76,legH-0.20,0.84,clothDark);
  put('woodDark', footSpread,0.28,-walk,0.76,legH-0.20,0.84,clothDark);

  // 躯干：基础衣着只是人物识别语汇；真实兽皮衣、工具与状态仍须读取权威事实。
  put('accent',0,torsoBottom+breath,leanZ,shoulder,torsoH,1.22,cloth);
  if (outfitCut==='wrap'){
    put('accent',0,torsoBottom-0.08,leanZ,shoulder+0.12,0.78,1.34,clothDark);
    put('clothBand',0,torsoBottom+torsoH-0.72,leanZ+0.66,shoulder+0.18,0.24,0.14,vary(clothBase,0.01,0.05,0.10));
  } else if (outfitCut==='long-tunic'){
    put('accent',0,torsoBottom-0.18,leanZ,shoulder+0.06,1.02,1.28,cloth);
    put('accent',0,torsoBottom+0.18,leanZ+0.66,0.22,0.90,0.12,clothDark);
  } else if (outfitCut==='panel-vest'){
    put('accent',-shoulder*0.36,torsoBottom+0.16,leanZ+0.66,0.34,torsoH-0.30,0.14,clothDark);
    put('accent', shoulder*0.36,torsoBottom+0.16,leanZ+0.66,0.34,torsoH-0.30,0.14,clothDark);
    put('clothBand',0,torsoBottom+torsoH-0.40,leanZ+0.66,shoulder+0.12,0.24,0.14,vary(clothBase,0.01,0.05,0.09));
  } else if (sex==='female'){
    put('accent',0,torsoBottom-0.08,leanZ,2.34,0.72,1.34,clothDark);
    put('accent',0,torsoBottom+torsoH-0.44,leanZ,2.30,0.28,1.30,vary(clothBase,0.01,0.05,0.10));
  } else {
    put('accent',0,torsoBottom+torsoH-0.38,leanZ,shoulder+0.12,0.24,1.30,vary(clothBase,0.01,0.05,0.09));
  }

  const shoulderY = torsoBottom + torsoH - 0.35 + breath;
  const armX = shoulder/2 + 0.34;
  if (gather){
    const reach = 0.18 + (Math.sin(phase)*0.5+0.5)*0.34;
    put('accent',-armX,shoulderY-0.56,leanZ+0.62+reach,0.52,0.54,1.55,cloth);
    put('accent', armX,shoulderY-0.56,leanZ+0.62+reach,0.52,0.54,1.55,cloth);
    put('skin',-armX,shoulderY-0.58,leanZ+1.48+reach,0.54,0.54,0.54,skin);
    put('skin', armX,shoulderY-0.58,leanZ+1.48+reach,0.54,0.54,0.54,skin);
  } else if (attack){
    const thrust = (Math.sin(phase)*0.5+0.5)*0.75;
    put('accent',-armX,shoulderY-0.28,0.58,0.55,0.56,1.52,cloth);
    put('accent', armX,shoulderY-0.28,0.62+thrust,0.55,0.56,1.64,cloth);
    put('skin', armX,shoulderY-0.28,1.52+thrust,0.56,0.56,0.56,skin);
    put('woodDark',armX,shoulderY-0.28,2.72+thrust,0.24,0.24,4.20,0x6b4a2e);
    put('stone',armX,shoulderY-0.28,4.92+thrust,0.48,0.48,0.72,0x9aa0a6);
  } else if (carry){
    put('accent',-armX,shoulderY-0.52,0.68,0.52,0.52,1.52,cloth);
    put('accent', armX,shoulderY-0.52,0.68,0.52,0.52,1.52,cloth);
    put('skin',-armX,shoulderY-0.52,1.50,0.54,0.54,0.54,skin);
    put('skin', armX,shoulderY-0.52,1.50,0.54,0.54,0.54,skin);
  } else if (ingest){
    const sip = Math.sin(phase)*0.08;
    put('accent',-armX,shoulderY-0.70,0.62,0.52,0.52,1.36,cloth);
    put('accent', armX,shoulderY-0.70,0.62,0.52,0.52,1.36,cloth);
    put('skin',-0.52,shoulderY-0.35,1.22+sip,0.52,0.52,0.52,skin);
    put('skin', 0.52,shoulderY-0.35,1.22+sip,0.52,0.52,0.52,skin);
  } else if (craft || work || tendFire){
    const beat = Math.sin(phase)*0.28;
    put('accent',-armX,shoulderY-0.62,leanZ+0.72,0.52,0.54,1.48,cloth);
    put('skin',-armX,shoulderY-0.64,leanZ+1.55,0.52,0.52,0.52,skin);
    put('accent', armX,shoulderY-0.32+beat,leanZ+0.56,0.52,1.28,0.58,cloth);
    put('skin', armX,shoulderY-1.02+beat,leanZ+0.62,0.52,0.52,0.52,skin);
  } else if (attend){
    put('accent',-armX,shoulderY-0.68,0.62,0.52,0.52,1.32,cloth);
    put('accent', armX,shoulderY-0.68,0.62,0.52,0.52,1.32,cloth);
    put('skin',-0.54,shoulderY-0.66,1.28,0.48,0.48,0.48,skin);
    put('skin', 0.54,shoulderY-0.66,1.28,0.48,0.48,0.48,skin);
  } else if (communicate){
    const wave = Math.sin(phase)*0.14;
    put('accent',-armX,shoulderY-1.20,0,0.56,2.05,0.82,cloth);
    put('skin',-armX,shoulderY-2.28,0,0.58,0.56,0.82,skin);
    put('accent', armX,shoulderY-0.15,0.18,0.56,1.72,0.72,cloth);
    put('skin', armX+wave,shoulderY+0.78,0.18,0.58,0.58,0.72,skin);
  } else if (care){
    put('accent',-armX,shoulderY-0.60,1.00,0.52,0.52,1.52,cloth);
    put('accent', armX,shoulderY-0.60,1.00,0.52,0.52,1.52,cloth);
    put('skin',-armX,shoulderY-0.62,1.86,0.52,0.52,0.52,skin);
    put('skin', armX,shoulderY-0.62,1.86,0.52,0.52,0.52,skin);
  } else {
    put('accent',-armX,shoulderY-1.20,-walk*0.72,0.56,2.05,0.82,cloth);
    put('accent', armX,shoulderY-1.20, walk*0.72,0.56,2.05,0.82,cloth);
    put('skin',-armX,shoulderY-2.28,-walk*0.72,0.58,0.56,0.82,skin);
    put('skin', armX,shoulderY-2.28, walk*0.72,0.58,0.56,0.82,skin);
  }

  // 头部与发型：轮廓模块只负责稳定辨认，不预设职业、能力或社会身份。
  const headProfile = headShape==='wide' ? {w:1.14,h:0.92,d:1.04}

function sharedCellSlots(count){
  if (count<=1) return [[0,0]];
  if (count===2) return [[-1.65,0],[1.65,0]];
  if (count===3) return [[0,-1.75],[-1.65,1.15],[1.65,1.15]];
  if (count===4) return [[-1.55,-1.55],[1.55,-1.55],[-1.55,1.55],[1.55,1.55]];
  const radius = count===5 ? 2.40 : 2.68;
  return Array.from({length:count},(_,i)=>{
    const a = -Math.PI/2 + i*Math.PI*2/count;
    return [Math.cos(a)*radius,Math.sin(a)*radius];
  });
}

function stableTextHash(value){
  let hash = 2166136261;
  for(let i=0;i<value.length;i++) hash = Math.imul(hash ^ value.charCodeAt(i),16777619);
  return hash >>> 0;
}

// 生产接入时可由 world seed + person id 重建；这里先验证组合语汇与同屏辨识度。
function appearanceForStablePerson(personId){
  const hash = stableTextHash(personId);
  return {
    skin:HUMAN_SKIN_PALETTES[hash % HUMAN_SKIN_PALETTES.length],
    hair:HUMAN_HAIR_PALETTES[(hash >>> 3) % HUMAN_HAIR_PALETTES.length],
    cloth:HUMAN_CLOTH_PALETTES[(hash >>> 6) % HUMAN_CLOTH_PALETTES.length],
    hairStyle:HUMAN_HAIR_STYLES[(hash >>> 10) % HUMAN_HAIR_STYLES.length],
    headShape:HUMAN_HEAD_SHAPES[(hash >>> 14) % HUMAN_HEAD_SHAPES.length],
    outfitCut:HUMAN_OUTFIT_CUTS[(hash >>> 17) % HUMAN_OUTFIT_CUTS.length],
  };
}

  'woodpile','stonepile','foodpile','seedpile','bundles','meatpile','hidepile','bonepile','stonetools','bonetools','spearrack','tablet','fiber','leather','rope','container','cookedfood','herbs','charcoal','clay','copperore','tinore','ironore','woodtool','stonehoe','bronzetool','irontool',
  'deer','deer-family','rabbit','boar','wolf','animal-chase','animal-state','spruce','oak','birch','acacia','sakura','palm','deadtree','bush','flowers','wheat','rocks','grasstuft','reeds','mushrooms','branch','dirtpath',
  'surface-transition','shoreline-transition','fire','scorched','snowdrift','icespikes','snowspruce','riverflow','rain','snowfall','fog','storm','drought'
]);
const assetStatus = (s) => LIVE_ASSET_KEYS.has(s.key) ? 'live' : 'prototype';

/* ================= 渲染器 / 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance', preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('assetStage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161a20);

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.5, 600);
camera.position.set(26, 24, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.5;
controls.minDistance = 5;
controls.maxDistance = 160;
controls.autoRotateSpeed = 1.2;

// 影棚环境（柔和渐变 → PMREM 环境反射）
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, '#3a4356'); grad.addColorStop(0.5, '#232a36'); grad.addColorStop(1, '#12151b');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  scene.environmentIntensity = 0.7;
  pmrem.dispose(); tex.dispose();
}

const sun = new THREE.DirectionalLight(0xfff0dc, 2.8);
sun.position.set(40, 62, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.5;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd2ec, 0x4a4438, 0.5));
const rim = new THREE.DirectionalLight(0x9fb8e8, 0.6);
rim.position.set(-36, 24, -40);
scene.add(rim);

// 阴影承接地面（仅显示柔和投影）
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.28 }));
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1.499;
  ground.receiveShadow = true;
  scene.add(ground);
}

/* ================= 后处理管线 ================= */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius:0.8, distanceExponent:1, thickness:1, scale:1, samples:16, distanceFallOff:1, screenSpaceRadius:false });
gtao.blendIntensity = 1.1;
composer.addPass(gtao);

const TiltShiftShader = {
  uniforms: {
    tDiffuse: { value:null },
    uRes: { value:new THREE.Vector2(1,1) },
    uFocusY: { value:0.5 }, uBand: { value:0.13 }, uMaxBlur: { value:9.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uFocusY,uBand,uMaxBlur;
    varying vec2 vUv;
    void main(){
      float d = abs(vUv.y - uFocusY);
      float b = smoothstep(uBand, uBand*3.0, d);
      vec2 r = uMaxBlur * b / uRes;
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      col += texture2D(tDiffuse, vUv + vec2( 1.0, 0.0)*r).rgb;
      col += texture2D(tDiffuse, vUv + vec2(-1.0, 0.0)*r).rgb;
      col += texture2D(tDiffuse, vUv + vec2( 0.0, 1.0)*r).rgb;
      col += texture2D(tDiffuse, vUv + vec2( 0.0,-1.0)*r).rgb;
      col += texture2D(tDiffuse, vUv + vec2( 0.707, 0.707)*r).rgb;
      col += texture2D(tDiffuse, vUv + vec2(-0.707, 0.707)*r).rgb;
      col += texture2D(tDiffuse, vUv + vec2( 0.707,-0.707)*r).rgb;
      col += texture2D(tDiffuse, vUv + vec2(-0.707,-0.707)*r).rgb;
      col /= 9.0;
      float vig = 1.0 - smoothstep(0.4, 1.0, length(vUv - vec2(0.5)));
      col *= mix(0.82, 1.0, vig);
      gl_FragColor = vec4(col, 1.0);
    }`,
};
const tiltPass = new ShaderPass(TiltShiftShader);
composer.addPass(tiltPass);
composer.addPass(new OutputPass());
const fxaa = new ShaderPass(FXAAShader);
composer.addPass(fxaa);

function updatePassSizes(){
  const pr = renderer.getPixelRatio();
  tiltPass.uniforms.uRes.value.set(innerWidth*pr, innerHeight*pr);
  fxaa.material.uniforms.resolution.value.set(1/(innerWidth*pr), 1/(innerHeight*pr));
}
updatePassSizes();
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  gtao.setSize(innerWidth, innerHeight);
  updatePassSizes();
});

/* ================= 生成 / 合批 / 取景 ================= */
const boxGeo = new THREE.BoxGeometry(1,1,1);
const dummy = new THREE.Object3D();
const ctmp = new THREE.Color();
let meshGroup = new THREE.Group();
scene.add(meshGroup);

let curStyle = 0, seed = (Math.random()*1e9)|0, gridMode = 'p'; // gridMode: null | 'p' | 'b' | 'n'
let lastExport = { name:'', seed:0, count:0, buckets:new Map() };

function buildMeshes(buckets){
  scene.remove(meshGroup);
  meshGroup.traverse(o=>{ if (o.isInstancedMesh) o.dispose(); });
  meshGroup = new THREE.Group();
  let total = 0;
  for (const [type, arr] of buckets){
    const n = arr.length/7; total += n;
    const mesh = new THREE.InstancedMesh(boxGeo, MATS[type], n);
    for(let i=0;i<n;i++){
      const o=i*7;
      dummy.position.set(arr[o]*LAB_MICRO, arr[o+1]*LAB_MICRO, arr[o+2]*LAB_MICRO);
      dummy.scale.set(arr[o+3]*LAB_MICRO, arr[o+4]*LAB_MICRO, arr[o+5]*LAB_MICRO);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      ctmp.setHex(arr[o+6]); mesh.setColorAt(i, ctmp);
    }
    mesh.castShadow = CAST_SHADOW.has(type);
    mesh.receiveShadow = true;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    meshGroup.add(mesh);
  }
  scene.add(meshGroup);
  return total;
}

function mergeInto(target, src, ox, oz){
  for (const [type, arr] of src.buckets){
    let a = target.get(type);
    if (!a){ a=[]; target.set(type,a); }
    const mx=ox/LAB_MICRO, mz=oz/LAB_MICRO;
    for(let i=0;i<arr.length;i+=7)
      a.push(arr[i]+mx, arr[i+1], arr[i+2]+mz, arr[i+3], arr[i+4], arr[i+5], arr[i+6]);
  }
}

function regenerate(preserveView=false){
  const buckets = new Map();
  let total = 0, name = '';
    const baseOf = (s) => (B) => {                               // 建筑石台座 / 环境草皮(雪/焦土)底座
    if (s.base === 'none') return;
    if (s.cat === 'b') addPedestal(B);
    else addGround(B, 2, s.ground || 'grass');
  };
  if (gridMode){
    const list = STYLES.filter(s => gridMode==='b' ? s.cat==='b' : gridMode==='p' ? s.cat==='p' : s.cat!=='b' && s.cat!=='p');
    name = gridMode==='b' ? 'civilization-lv1-8' : gridMode==='p' ? 'people-and-actions' : 'environment-pack';
    if (gridMode==='b'){
      const S = 26;
      list.forEach((s, i)=>{
        rand = mulberry32(seed + i*7919);
        const B = createBuilder();
        s.gen(B); baseOf(s)(B);
        mergeInto(buckets, B, (i%4)*S - 39, Math.floor(i/4)*S - 39);   // 4×4
        total += B.count();
      });
      if (!preserveView){
        controls.target.set(0, 3, 0);
        camera.position.set(62, 56, 62);
        setShadowExtent(58);
      }
    } else if (gridMode==='p') {
      const S = 14, COLS = 5, rows = Math.ceil(list.length / COLS);
      list.forEach((s, i)=>{
        rand = mulberry32(seed + i*7919);
        const B = createBuilder();
        s.gen(B); baseOf(s)(B);
        mergeInto(buckets, B, (i%COLS)*S - (COLS-1)*S/2, Math.floor(i/COLS)*S - (rows-1)*S/2);
        total += B.count();
      });
      if (!preserveView){
        controls.target.set(0, 2.2, 0);
        camera.position.set(40, 34, 48);
        setShadowExtent(46);
      }
    } else {
      const S = 24, COLS = 5, rows = Math.ceil(list.length / COLS);    // 5×6
      list.forEach((s, i)=>{
        rand = mulberry32(seed + i*7919);
        const B = createBuilder();
        s.gen(B); baseOf(s)(B);
        mergeInto(buckets, B, (i%COLS)*S - (COLS-1)*S/2, Math.floor(i/COLS)*S - (rows-1)*S/2);
        total += B.count();
      });
      if (!preserveView){
        controls.target.set(0, 2, 0);
        camera.position.set(58, 54, 86);
        setShadowExtent(78);
      }
    }
    controls.maxDistance = 320;
  } else {
    const s = STYLES[curStyle];
    name = s.key;
    rand = mulberry32(seed);
    const B = createBuilder();
    s.gen(B); baseOf(s)(B);
    for (const [t,a] of B.buckets) buckets.set(t, a);
    total = B.count();
    const maxY = B.bounds.maxY;
    const span = Math.max(B.bounds.maxX-B.bounds.minX, B.bounds.maxZ-B.bounds.minZ);
    const d = Math.max(span, maxY) * 1.35 + 12;
    if (!preserveView){
      controls.target.set(0, Math.max(2, maxY*0.42), 0);
      camera.position.set(d*0.72, d*0.62, d*0.72);
      setShadowExtent(Math.max(14, span/2 + 6));
    }
    controls.maxDistance = 160;
  }
  const drawn = buildMeshes(buckets);
  lastExport = { name, seed, count: total, buckets };
  document.getElementById('seedTag').textContent = `seed ${seed}${gridMode?' · 总览':''}`;
  document.getElementById('stats').innerHTML =
    `<b>${total.toLocaleString()}</b> cuboids · <b>${buckets.size}</b> batches · <b>${drawn.toLocaleString()}</b> instances`;
  updateDetail();
}

function setShadowExtent(e){
  sun.shadow.camera.left = -e; sun.shadow.camera.right = e;
  sun.shadow.camera.top = e; sun.shadow.camera.bottom = -e;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 220;
  sun.shadow.camera.updateProjectionMatrix();
}

/* ================= UI ================= */
const listEl = document.getElementById('styleList');
const styleBtns = [];
let lastLv = 0, lastCat = '', lastGroup = '';
STYLES.forEach((s, i)=>{
  if (s.cat !== lastCat){                                    // 大类分节
    lastCat = s.cat; lastGroup = '';
    const t = document.createElement('div');
    t.className = 'section-title';
    t.textContent = CAT_NAMES[s.cat];
    listEl.appendChild(t);
  }
  const gk = s.cat==='b' ? `LV.${s.lv} · ${LV_NAMES[s.lv]}` : s.group;
  if (s.cat!=='b' ? gk!==lastGroup : (s.cat==='b' && s.lv!==lastLv)){
    if (s.cat==='b') lastLv = s.lv; else lastGroup = gk;
    const h = document.createElement('div');
    h.className = 'group';
    h.textContent = gk;
    listEl.appendChild(h);
  }
  const b = document.createElement('button');
  b.className = 'style-btn';
  const status = assetStatus(s);
  b.innerHTML = `${s.name}<span class="status-dot ${status}">${status==='live'?'已接入':'原型'}</span><small>${s.en.toUpperCase()}</small>`;
  b.onclick = ()=>{ gridMode = null; curStyle = i; refreshActive(); regenerate(); };
  listEl.appendChild(b);
  styleBtns.push(b);
});
const gridBtnB = document.createElement('button');
gridBtnB.className = 'style-btn';
gridBtnB.innerHTML = `总览 · 文明长卷<small>BUILDINGS 4 × 4</small>`;
gridBtnB.onclick = ()=>{ gridMode = 'b'; refreshActive(); regenerate(); };
listEl.appendChild(gridBtnB);
const gridBtnP = document.createElement('button');
gridBtnP.className = 'style-btn';
gridBtnP.innerHTML = `总览 · 人物动作<small>PEOPLE & ACTIONS · AUTO GRID</small>`;
gridBtnP.onclick = ()=>{ gridMode = 'p'; refreshActive(); regenerate(); };
listEl.appendChild(gridBtnP);
const gridBtnN = document.createElement('button');
gridBtnN.className = 'style-btn';
gridBtnN.innerHTML = `总览 · 世界素材<small>WORLD ASSETS · AUTO GRID</small>`;
gridBtnN.onclick = ()=>{ gridMode = 'n'; refreshActive(); regenerate(); };
listEl.appendChild(gridBtnN);
function refreshActive(){
  styleBtns.forEach((el, i)=> el.classList.toggle('active', !gridMode && i===curStyle));
  gridBtnB.classList.toggle('active', gridMode==='b');
  gridBtnP.classList.toggle('active', gridMode==='p');
  gridBtnN.classList.toggle('active', gridMode==='n');
}
function updateDetail(){
  const el = document.getElementById('detail');
  if (gridMode==='p'){
    const people = STYLES.filter(s=>s.cat==='p');
    const live = people.filter(s=>assetStatus(s)==='live').length;
    el.innerHTML = `<b>人物与动作总览</b><span class="status prototype">${live} 项已接入 · ${people.length-live} 项视觉原型</span><br><span class="tags">稳定外观 · 年龄 · 身体状态 · 生产动作 · 社会交互</span><span class="note">外观原型只做确定性组合；道具、伤势、装备和身份标志仍须来自实际模拟字段与历史。</span>`;
    return;
  }
  if (gridMode){
    const list = STYLES.filter(s=>gridMode==='b'?s.cat==='b':s.cat!=='b'&&s.cat!=='p');
    const live = list.filter(s=>assetStatus(s)==='live').length;
    el.innerHTML = `<b>${gridMode==='b'?'文明建筑长卷':'世界素材长卷'}</b><span class="tags">${live} 项已接入 · ${list.length-live} 项视觉原型</span><span class="note">原型可继续预览和导出，但不会暗示模拟规则已经支持。</span>`;
    return;
  }
  const s = STYLES[curStyle];
  const status = assetStatus(s);
  el.innerHTML = `<b>${s.name} · ${s.en}</b><span class="status ${status}">${status==='live'?'已接入主游戏':'视觉原型 · 规则未接入'}</span><br><span class="tags">${s.tags || CAT_NAMES[s.cat]}</span>${s.note?`<span class="note">${s.note}</span>`:''}`;
}
refreshActive();

mountRulesPage({
  assets: STYLES.map((style) => ({
    key: style.key,
    name: style.name,
    en: style.en,
    group: style.group || (style.lv ? `LV.${style.lv} · ${LV_NAMES[style.lv]}` : ''),
    category: CAT_NAMES[style.cat],
    tags: style.tags || '',
    note: style.note || '',
    status: assetStatus(style) === 'live' ? '已接入' : '视觉原型',
  })),
  selectAsset(key) {
    const index = STYLES.findIndex((style) => style.key === key);
    if (index < 0) return false;
    gridMode = null;
    curStyle = index;
    refreshActive();
    regenerate();
    styleBtns[index]?.scrollIntoView({ block: 'center' });
    return true;
  },
});

document.getElementById('btnSeed').onclick = ()=>{ seed = (Math.random()*1e9)|0; regenerate(); };
const btnRotate = document.getElementById('btnRotate');
btnRotate.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; btnRotate.classList.toggle('on', controls.autoRotate); };
document.getElementById('btnPNG').onclick = ()=>{
  composer.render();
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = `voxel-${lastExport.name}-${lastExport.seed}.png`;
  a.click();
};
document.getElementById('btnJSON').onclick = ()=>{
  const cuboids = {};
  for (const [type, arr] of lastExport.buckets){
    const list = [];
    for(let i=0;i<arr.length;i+=7)
      list.push([arr[i], arr[i+1], arr[i+2], arr[i+3], arr[i+4], arr[i+5], arr[i+6]]);
    cuboids[type] = list;
  }
  const data = {
    format: 'micro-cuboid-v2', generator: lastExport.name, seed: lastExport.seed,
    mapCellMicroVoxels: MICRO_PER_MAP_CELL, worldUnitPerMicroVoxel: 1/MICRO_PER_MAP_CELL,
    legacyVoxelMicroSize: LEGACY_VOXEL_MICROS,
    note: '每个构件: [mx, my中心, mz, sx, sy, sz, 0xRRGGBB]；坐标和尺寸均以 1/8 地图格计',
    count: lastExport.count, cuboids,
  };
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `voxel-${lastExport.name}-${lastExport.seed}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
addEventListener('keydown', (e)=>{
  if (document.body.dataset.page !== 'assets') return;
  if (e.key >= '1' && e.key <= '8'){                    // 跳转到对应文明等级的首个建筑
    const idx = STYLES.findIndex(s => s.cat==='b' && s.lv === +e.key);
    if (idx >= 0){ gridMode = null; curStyle = idx; refreshActive(); regenerate(); }
  }
  if (e.key === '9'){ gridMode = 'b'; refreshActive(); regenerate(); }   // 建筑长卷
  if (e.key === '0'){ gridMode = 'n'; refreshActive(); regenerate(); }   // 环境长卷
  if (e.key.toLowerCase() === 'p'){ gridMode = 'p'; refreshActive(); regenerate(); }
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastHumanRefresh = 0;
let lastAnimalRefresh = 0;
let lastFireRefresh = 0;
let lastWeatherRefresh = 0;
const ANIMATED_ANIMAL_KEYS = new Set(['deer','deer-family','rabbit','boar','wolf','animal-chase','animal-state','sheep','chicken']);
const ANIMATED_WEATHER_KEYS = new Set(['riverflow','rain','snowfall','fog','storm']);
renderer.setAnimationLoop((now)=>{
  if (document.body.dataset.page !== 'assets') return;
  const showingPeople = gridMode==='p' || (!gridMode && STYLES[curStyle].cat==='p');
  if (showingPeople && now-lastHumanRefresh > 100){
    humanAnimPhase = now*0.006;
    regenerate(true);
    lastHumanRefresh = now;
  }
  const showingAnimal = !gridMode && ANIMATED_ANIMAL_KEYS.has(STYLES[curStyle].key);
  if (showingAnimal && now-lastAnimalRefresh > 66){
    animalAnimPhase = now*0.0055;
    regenerate(true);
    lastAnimalRefresh = now;
  }
  const showingFire = !gridMode && STYLES[curStyle].key==='fire';
  if (showingFire && now-lastFireRefresh > 50){
    fireAnimPhase = now*0.0065;
    regenerate(true);
    lastFireRefresh = now;
  }
  const showingWeather = !gridMode && ANIMATED_WEATHER_KEYS.has(STYLES[curStyle].key);
  if (showingWeather && now-lastWeatherRefresh > 75){
    weatherAnimPhase = now*0.0048;
    regenerate(true);
    lastWeatherRefresh = now;
  }
  MATS.glowWarm.emissiveIntensity = 1.25 + Math.sin(now*0.011)*0.2 + Math.sin(now*0.027+1.2)*0.08;
  MATS.glowRed.emissiveIntensity = 1.4 + Math.sin(now*0.014+1)*0.22 + Math.sin(now*0.031)*0.08;
  controls.update();
  composer.render();
});
regenerate();
</script>
